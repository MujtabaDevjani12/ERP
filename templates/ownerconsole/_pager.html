{% if page.paginator.num_pages > 1 %}
<div class="pager"><span>Page {{ page.number }} of {{ page.paginator.num_pages }} &middot; {{ page.paginator.count }} total</span>
  <span class="row">{% if page.has_previous %}<a class="btn sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
  {% if page.has_next %}<a class="btn sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>{% endif %}</span></div>
{% endif %}
