<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f3f4f8;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1f2937">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f4f8;padding:28px 12px"><tr><td align="center">
  <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:14px;border:1px solid #e5e7eb">
    <tr><td style="padding:22px 28px;border-bottom:1px solid #eef0f4;font-weight:700;font-size:16px;color:#111827">{{ business|default:"ERP" }}</td></tr>
    <tr><td style="padding:26px 28px">
      <h1 style="margin:0 0 14px;font-size:20px;line-height:1.3;color:#111827">{{ title }}</h1>
      {% for p in paragraphs %}<p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#374151">{{ p }}</p>{% endfor %}
      {% if button %}<p style="margin:22px 0 6px"><a href="{{ button.1 }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px">{{ button.0 }}</a></p>
      <p style="margin:10px 0 0;font-size:12px;color:#6b7280;word-break:break-all">If the button does not work, copy this link into your browser:<br>{{ button.1 }}</p>{% endif %}
    </td></tr>
    {% if footer %}<tr><td style="padding:16px 28px;border-top:1px solid #eef0f4;font-size:12px;color:#6b7280;white-space:pre-line">{{ footer }}</td></tr>{% endif %}
  </table>
</td></tr></table>
</body></html>
