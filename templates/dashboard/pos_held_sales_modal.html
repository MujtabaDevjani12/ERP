<div x-show="showHeldSales" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(15,23,42,.5)">
  <div @click.outside="showHeldSales=false" x-show="showHeldSales" x-transition
       class="bg-white w-full max-w-lg rounded-2xl border border-gray-200 shadow-2xl max-h-[85vh] flex flex-col">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 shrink-0">
      <h2 class="text-sm font-bold tracking-wide text-ink">HELD SALES <span class="text-gray-400 font-normal text-xs">Ctrl+F2</span></h2>
      <button @click="showHeldSales=false" class="text-gray-400 hover:text-ink text-lg">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-2">
      <template x-if="!heldSales.length">
        <div class="text-center py-10">
          <p class="text-sm text-gray-400">No held sales right now.</p>
          <p class="text-xs text-gray-400 mt-1">Use "Hold" on the cart to park a sale and come back to it later.</p>
        </div>
      </template>
      <template x-for="s in heldSales" :key="s.id">
        <div class="flex items-center justify-between bg-gray-50 hover:bg-gray-100 border border-gray-100 rounded-xl px-4 py-3 transition">
          <div class="min-w-0">
            <p class="text-sm font-semibold text-ink truncate" x-text="s.reference"></p>
            <p class="text-xs text-gray-400 truncate" x-text="s.customer_name + ' · ' + s.item_count + ' item' + (s.item_count != 1 ? 's' : '') + ' · ' + s.created_at"></p>
          </div>
          <div class="flex items-center gap-3 shrink-0 ml-3">
            <span class="text-sm font-bold tabular-nums text-ink" x-text="fmt(s.total_amount)"></span>
            <button @click="resumeHeldSale(s.id)" class="tap text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 px-3 py-2 rounded-lg">Resume</button>
          </div>
        </div>
      </template>
    </div>

    <div class="p-4 border-t border-gray-100 shrink-0">
      <a href="{% url 'sales:sale_list' %}?status=held" class="block text-center text-xs text-gray-500 hover:text-ink">View full held-sales history →</a>
    </div>
  </div>
</div>
