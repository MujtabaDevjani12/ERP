<div x-show="showPaymentModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(15,23,42,.5)">
  <div @click.outside="showPaymentModal=false" x-show="showPaymentModal" x-transition
       class="bg-white w-full max-w-3xl rounded-2xl border border-gray-200 shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">

    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h2 class="text-base font-bold tracking-wide text-ink">FINALIZE SALE</h2>
      <button @click="showPaymentModal=false" class="text-gray-400 hover:text-ink text-lg">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto grid grid-cols-3">
      <!-- Left: details -->
      <div class="col-span-2 p-6 space-y-4 border-r border-gray-100">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Biller</label>
          <select x-model.number="billerId" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 rounded-lg text-sm px-3 py-2.5 text-ink">
            {% for b in billers %}<option value="{{ b.id }}">{{ b.get_full_name|default:b.username }}</option>{% endfor %}
          </select>
        </div>

        {% if current_store.business_type == "gold_diamond" %}
        <button type="button" class="w-full text-left bg-amber-50 border border-amber-200 hover:bg-amber-100 text-amber-700 text-xs font-semibold px-4 py-2.5 rounded-lg tap">
          ⇄ Gold / Diamond exchange (old item trade-in)
        </button>
        {% endif %}

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">Sale note</label>
            <textarea x-model="saleNote" rows="2" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 rounded-lg text-xs px-3 py-2 text-ink"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">Staff note</label>
            <textarea x-model="staffNote" rows="2" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 rounded-lg text-xs px-3 py-2 text-ink"></textarea>
          </div>
        </div>

        <div class="bg-gray-50 border border-gray-100 rounded-xl p-4 space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">Amount received</label>
            <input type="number" step="0.01" x-model="payAmount" autofocus
                   class="w-full bg-white border border-gray-200 focus:border-brand-500 rounded-lg text-lg font-bold px-3 py-2.5 tabular-nums text-ink" />
            <p class="text-[11px] text-gray-400 mt-1">Leave at 0 to put the whole sale on account (Due).</p>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-500 mb-2">Paying by</label>
            <div class="grid grid-cols-5 gap-2">
              <button type="button" @click="payMethod='cash'"
                      :class="payMethod==='cash' ? 'bg-brand-50 ring-2 ring-brand-500 text-brand-700' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-100'"
                      class="tap flex flex-col items-center gap-1.5 rounded-xl py-3 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2" stroke-width="2"/><circle cx="12" cy="12" r="2.5" stroke-width="2"/></svg>
                <span class="text-[10px] font-semibold">Cash</span>
              </button>
              <button type="button" @click="payMethod='card'"
                      :class="payMethod==='card' ? 'bg-brand-50 ring-2 ring-brand-500 text-brand-700' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-100'"
                      class="tap flex flex-col items-center gap-1.5 rounded-xl py-3 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" stroke-width="2"/><path d="M2 10h20" stroke-width="2"/></svg>
                <span class="text-[10px] font-semibold">Card</span>
              </button>
              <button type="button" @click="payMethod='bank_transfer'"
                      :class="payMethod==='bank_transfer' ? 'bg-brand-50 ring-2 ring-brand-500 text-brand-700' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-100'"
                      class="tap flex flex-col items-center gap-1.5 rounded-xl py-3 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18M4 21V10m16 11V10M5 10l7-6 7 6M6 10v0m12 0v0M9 21v-6h6v6"/></svg>
                <span class="text-[10px] font-semibold text-center leading-tight">Bank</span>
              </button>
              <button type="button" @click="payMethod='cheque'"
                      :class="payMethod==='cheque' ? 'bg-brand-50 ring-2 ring-brand-500 text-brand-700' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-100'"
                      class="tap flex flex-col items-center gap-1.5 rounded-xl py-3 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" stroke-width="2"/><path d="M6 9h6M6 13h4" stroke-linecap="round" stroke-width="2"/><circle cx="17" cy="15" r="2.5" stroke-width="2"/></svg>
                <span class="text-[10px] font-semibold">Cheque</span>
              </button>
              <button type="button" @click="payMethod='gift_card'"
                      :class="payMethod==='gift_card' ? 'bg-brand-50 ring-2 ring-brand-500 text-brand-700' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-100'"
                      class="tap flex flex-col items-center gap-1.5 rounded-xl py-3 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2" stroke-width="2"/><path d="M12 8v13M3 12h18" stroke-width="2"/><path d="M12 8c-1.5-3-5-3-5 0s3.5 0 5 0zm0 0c1.5-3 5-3 5 0s-3.5 0-5 0z" stroke-width="1.6"/></svg>
                <span class="text-[10px] font-semibold text-center leading-tight">Gift card</span>
              </button>
            </div>
          </div>

          <!-- Live status banner — updates as the cashier types, so it's
               obvious before submitting whether this will post as Due,
               Partial (with the exact balance left), or Paid in full. -->
          <div class="rounded-lg px-3.5 py-2.5 flex items-center justify-between text-sm"
               :class="{
                 'bg-rose-50 text-rose-700 border border-rose-200': saleStatus === 'due',
                 'bg-amber-50 text-amber-700 border border-amber-200': saleStatus === 'partial',
                 'bg-emerald-50 text-emerald-700 border border-emerald-200': saleStatus === 'paid',
               }">
            <span class="font-semibold uppercase tracking-wide text-xs" x-text="saleStatus === 'due' ? 'Due — nothing paid' : saleStatus === 'partial' ? 'Partial payment' : 'Paid in full'"></span>
            <span class="font-bold tabular-nums" x-show="saleStatus === 'partial'" x-text="'Balance left: ' + fmt(remainingDue)"></span>
            <span class="font-bold tabular-nums" x-show="saleStatus === 'paid' && changeDue > 0" x-text="'Change: ' + fmt(changeDue)"></span>
            <span class="font-bold tabular-nums" x-show="saleStatus === 'due'" x-text="'Full amount goes to Due'"></span>
          </div>

          <button @click="showSplitPayment = !showSplitPayment" type="button" class="text-xs text-gray-500 hover:text-ink underline">
            <span x-show="!showSplitPayment">+ Split into multiple payment methods</span>
            <span x-show="showSplitPayment" x-cloak>Hide split payment</span>
          </button>

          <div x-show="showSplitPayment" x-cloak class="space-y-2 pt-1 border-t border-gray-200">
            <button @click="addPaymentRow()" type="button" class="tap w-full bg-white border border-gray-200 hover:bg-gray-100 text-ink text-xs font-semibold py-2.5 rounded-lg">+ Add this amount as a payment row</button>
            <div class="space-y-1.5" x-show="payments.length" x-cloak>
              <template x-for="(p, i) in payments" :key="i">
                <div class="flex items-center justify-between text-xs bg-white border border-gray-200 rounded-lg px-3 py-2">
                  <span class="capitalize text-gray-600" x-text="p.method.replace('_',' ')"></span>
                  <span class="tabular-nums font-medium text-ink" x-text="fmt(p.amount)"></span>
                  <button @click="payments.splice(i,1)" class="text-gray-400 hover:text-rose-500">✕</button>
                </div>
              </template>
            </div>
            <p class="text-[11px] text-gray-400">Split rows total: <span class="tabular-nums font-medium text-gray-600" x-text="fmt(totalPaying)"></span></p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 text-xs bg-gray-50 border border-gray-100 rounded-xl p-4">
          <div><p class="text-gray-500">Total Items</p><p class="font-semibold tabular-nums mt-0.5 text-ink" x-text="cart.length"></p></div>
          <div class="text-right"><p class="text-gray-500">Total Payable</p><p class="font-semibold tabular-nums mt-0.5 text-ink" x-text="fmt(total)"></p></div>
        </div>
      </div>

      <!-- Right: quick cash -->
      <div class="p-4 space-y-2 bg-gray-50">
        <p class="text-xs font-medium text-gray-500 px-1 mb-1">Quick Cash</p>
        <button @click="quickCash(total)" class="tap w-full bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm py-3 rounded-lg tabular-nums" x-text="fmt(total)"></button>
        {% for amount in quick_cash %}
        <button @click="quickCash({{ amount }})" class="tap w-full bg-amber-400 hover:bg-amber-500 text-ink font-semibold text-sm py-2.5 rounded-lg tabular-nums">{{ amount }}</button>
        {% endfor %}
        <button @click="payAmount=0" class="tap w-full bg-white border border-rose-200 hover:bg-rose-50 text-rose-600 font-semibold text-sm py-2.5 rounded-lg mt-2">Clear (Due)</button>
      </div>
    </div>

    <div class="p-4 border-t border-gray-100">
      <button @click="completeSale()" :disabled="submitting" class="tap w-full disabled:opacity-40 text-white font-bold text-sm py-3.5 rounded-xl transition"
              :class="{
                'bg-rose-600 hover:bg-rose-700': saleStatus === 'due',
                'bg-amber-600 hover:bg-amber-700': saleStatus === 'partial',
                'bg-emerald-600 hover:bg-emerald-700': saleStatus === 'paid',
              }">
        <span x-show="!submitting" x-text="payButtonLabel"></span><span x-show="submitting" x-cloak>Processing…</span>
      </button>
    </div>
  </div>
</div>
