<div x-show="showAddCustomer" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(15,23,42,.5)">
  <div @click.outside="showAddCustomer=false" x-show="showAddCustomer" x-transition class="bg-white w-full max-w-md rounded-2xl border border-gray-200 shadow-2xl max-h-[92vh] flex flex-col">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 shrink-0">
      <h2 class="text-sm font-bold tracking-wide text-ink">ADD CUSTOMER <span class="text-gray-400 font-normal text-xs">Ctrl+Shift+A</span></h2>
      <button @click="showAddCustomer=false" class="text-gray-400 hover:text-ink text-lg">✕</button>
    </div>
    <div class="grid grid-cols-2 gap-3 p-6 overflow-y-auto">
      <div class="col-span-2">
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Name <span class="text-rose-500">*</span></label>
        <input x-model="newCustomerName" type="text" autofocus class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 focus:bg-white rounded-lg text-sm px-3 py-2.5 text-ink" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Phone</label>
        <input x-model="newCustomerPhone" type="text" placeholder="03xx-xxxxxxx" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 focus:bg-white rounded-lg text-sm px-3 py-2.5 text-ink" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1.5">CNIC</label>
        <input x-model="newCustomerCnic" type="text" placeholder="35201-1234567-1" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 focus:bg-white rounded-lg text-sm px-3 py-2.5 text-ink" />
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Email</label>
        <input x-model="newCustomerEmail" type="email" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 focus:bg-white rounded-lg text-sm px-3 py-2.5 text-ink" />
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Address</label>
        <input x-model="newCustomerAddress" type="text" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 focus:bg-white rounded-lg text-sm px-3 py-2.5 text-ink" />
      </div>
      {% if customer_groups %}
      <div class="col-span-2">
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Customer group</label>
        <select x-model="newCustomerGroup" class="w-full bg-gray-50 border border-gray-200 focus:border-brand-500 focus:bg-white rounded-lg text-sm px-3 py-2.5 text-ink">
          <option value="">— None —</option>
          {% for g in customer_groups %}
          <option value="{{ g.id }}">{{ g.name }} ({{ g.price_adjustment_percentage }}%)</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <p x-show="addCustomerError" x-text="addCustomerError" class="col-span-2 text-xs text-rose-500"></p>
      <button @click="addCustomer()" :disabled="!newCustomerName" class="tap col-span-2 w-full bg-brand-500 hover:bg-brand-600 disabled:opacity-40 text-white font-semibold text-sm py-2.5 rounded-lg mt-1">Save &amp; select</button>
    </div>
  </div>
</div>
